name: CI/CD Pipeline - revisor-codigo-ia-gio

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências, linter e testes
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          pip install -r requirements.txt
          
      - name: 1. Executar Linting (Ruff)
        run: ruff check .

      - name: 2. Executar Testes Automáticos (Pytest)
        run: pytest --disable-warnings -v
        
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/
            !.venv/
            !.git/

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      id-token: write 
      contents: read 

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0A5ACC41218F44578B5D401682D8D8E2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DADBF0FC976D428CA5A925BF6FFF1F48 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_AC833CB369B742038E7189C83274CD24 }}

      - name: 4. Publicação Automática no Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'revisor-codigo-ia-gio'
          slot-name: 'Production'
